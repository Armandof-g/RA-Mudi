<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Visor 3D y Realidad Aumentada</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Soporte para WebXR y Model Viewer v4.1.0 (Google AR) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <script src="js/qrcode.min.js"></script>
</head>
<body>

  <div id="viewer-wrapper" class="viewer-wrapper">
    <!-- Video en vivo de la cámara trasera para Realidad Aumentada Universal -->
    <video id="ar-camera-video" class="ar-camera-video" autoplay playsinline muted></video>

    <!-- Pantalla de Carga Inicial -->
    <div id="loader-overlay" class="loader-overlay">
      <div class="spinner"></div>
      <div id="loader-text" class="loader-text">Cargando modelo 3D...</div>
    </div>

    <!-- Barra Superior Flotante -->
    <div class="viewer-topbar">
      <div class="model-info-pill">
        <a href="index.html" class="btn btn-secondary btn-sm" style="padding: 0.25rem 0.5rem;" title="Volver al panel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
        <span id="model-display-name" class="pill-title">Cargando...</span>
        <span id="model-format-badge" class="badge">3D</span>
      </div>

      <!-- Botón para cerrar el modo Cámara RA -->
      <button id="btn-close-camera-ar" class="btn-close-ar" style="display: none;">
        ✕ Salir de RA
      </button>
    </div>

    <!-- Contenedor transformable para mover y escalar el modelo sobre la cámara -->
    <div id="ar-model-stage" class="ar-model-stage">
      <model-viewer 
        id="ar-model-viewer"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="auto"
        ar-placement="floor"
        environment-image="neutral"
        shadow-intensity="1.4"
        shadow-softness="0.7"
        exposure="1.05"
        bounds="tight"
        min-camera-orbit="auto 0deg auto"
        max-camera-orbit="auto 90deg auto"
        quick-look-browsers="safari chrome"
        interpolation-decay="1"
        camera-controls
        touch-action="none"
        auto-rotate
        rotation-per-second="15deg">
        <!-- Ocultar botón interno por defecto de model-viewer para usar nuestro lanzador híbrido -->
        <span slot="ar-button" style="display: none;"></span>
      </model-viewer>

      <!-- Capa táctil para arrastrar el modelo en el piso cuando está activo el modo "Mover" -->
      <div id="ar-drag-layer" class="ar-drag-layer" style="display: none;"></div>
    </div>

    <!-- Botón Principal de Realidad Aumentada (Vista Previa) -->
    <button type="button" id="btn-launch-ar" class="btn-ar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
      <span>Ver en tu espacio (AR)</span>
    </button>

    <!-- Guía táctil flotante cuando la Cámara RA está activa (sin botones de cambio de modo) -->
    <div id="camera-ar-hud" class="camera-ar-hud" style="display: none; pointer-events: none;">
      <div class="ar-hud-hint" id="ar-hud-hint">
        ✋ 1 dedo en objeto: Mover • 🔄 2 dedos (o 1 afuera): Girar • 🤏 Pellizcar: Escalar • Doble toque: Centrar
      </div>
    </div>
  </div>

  <!-- Modal para cuando se intenta ver en AR desde una computadora -->
  <div id="desktop-qr-modal" class="pin-modal-overlay hidden">
    <div class="pin-card" style="max-width: 340px;">
      <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem;">Ver en Realidad Aumentada</h3>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem;">
        Escanea este código con la cámara de tu celular (Android o iPhone) para proyectar el modelo en tu espacio real:
      </p>
      <div style="background: #fff; padding: 1rem; border-radius: 12px; display: inline-block; margin-bottom: 1.25rem;">
        <div id="desktop-qr-box"></div>
      </div>
      <button id="close-desktop-qr" class="btn btn-secondary" style="width: 100%;">Cerrar</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/viewer.js?v=6dof"></script>
</body>
</html>
